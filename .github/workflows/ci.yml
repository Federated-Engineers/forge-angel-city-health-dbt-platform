name: CI
run-name: CI trigerred by ${{ github.actor }}'s ${{ github.event_name }} event
on: [push]

jobs:
  code-lint:
    name: Code Lint for SQL and Python files.
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6.0.2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement ./requirements-dev.txt
      - name: Run SQLFluff
        run: |
          sqlfluff lint --dialect snowflake .
      - name: Running ISort
        run: |
          isort .
      - name: Running Flake8
        run: |
          flake8 .
